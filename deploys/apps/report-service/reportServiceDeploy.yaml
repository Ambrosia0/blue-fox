apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: blog
spec:
  selector:
    app: report-service
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  labels:
    app: report-service
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
      - name: report-service
        image: ghcr.io/Ambrosia0/report-service:0.0.1-SNAPSHOT
        ports:
          - containerPort: 8080
        resources:
          requests:
            memory: "1Gi"
          limits:
            memory: "1Gi"
        env:
          - name: JAVA_OPTS
            value: ""
          - name: OIDC_ISSUER_URL
            valueFrom:
              configMapKeyRef:
                name: oidc-config
                key: oidc-issuer-url
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: report-db
                key: username
          - name: DB_URL
            valueFrom:
              secretKeyRef:
                name: report-db
                key: url
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: report-db
                key: password
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
          - name: REDIS_URL
            valueFrom:
              configMapKeyRef:
                name: redis-config
                key: redis-url
      serviceAccountName: default
      automountServiceAccountToken: true
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: blog
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ghcr.io/Ambrosia0/notification-service:0.0.1-SNAPSHOT
        ports:
          - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"
          limits:
            memory: "1Gi"
        env:
          - name: JAVA_OPTS
            value: ""
          - name: OIDC_ISSUER_URL
            valueFrom:
              configMapKeyRef:
                name: oidc-config
                key: oidc-issuer-url
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
      serviceAccountName: default
      automountServiceAccountToken: true
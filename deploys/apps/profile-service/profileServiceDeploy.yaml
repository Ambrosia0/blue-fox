apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: blog
spec:
  selector:
    app: profile-service
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 8080
    - protocol: TCP
      name: grpc
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  labels:
    app: profile-service
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
      - name: profile-service
        image: ghcr.io/Ambrosia0/profile-service:0.0.1-SNAPSHOT
        ports:
          - containerPort: 8080
          - containerPort: 9090
        resources:
          requests:
            memory: "512Mi"
          limits:
            memory: "1Gi"
        env:
          - name: JAVA_OPTS
            value: ""
          - name: KC_KEY_ROTATION
            valueFrom:
              configMapKeyRef:
                key: keycloak-config
                value: key-rotation
                optional: true
          - name: KC_REALM
            valueFrom:
              configMapKeyRef:
                key: keycloak-config
                value: realm
          - name: KC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                key: keycloak-config
                value: profile-client-id
          - name: KC_BASE_URL
            valueFrom:
              configMapKeyRef:
                key: keycloak-config
                value: base-url
            # value: http://keycloak.keycloak.svc.cluster.local:8080/auth
          - name: KC_SECRET
            valueFrom:
              secretKeyRef:
                name: keycloak-config
                key: secret
                
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-config
                key: access-key
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: s3-config
                key: secret-key
          - name: S3_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: public-bucket
          - name: S3_PRESIGN_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: s3-config
                key: override-presign-endpoint
                optional: true
          - name: OIDC_ISSUER_URL
            valueFrom:
              configMapKeyRef:
                name: oidc-config
                key: oidc-issuer-url
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: profile-db
                key: username
          - name: DB_URL
            valueFrom:
              secretKeyRef:
                name: profile-db
                key: url
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: profile-db
                key: password
          - name: KAFKA_BOOTSTRAP_SERVERS
            valueFrom:
              configMapKeyRef:
                name: kafka-config
                key: bootstrap-servers
          - name: REDIS_URL
            valueFrom:
              configMapKeyRef:
                name: redis-config
                key: redis-url
          - name: ELASTIC_URIS
            valueFrom:
              secretKeyRef:
                name: elastic-config
                key: elastic-uris
      serviceAccountName: default
      automountServiceAccountToken: true
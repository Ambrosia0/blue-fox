apiVersion: v1
kind: Service
metadata:
  name: commentdb
  namespace: blog
spec:
  selector:
    app: comment-service-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-service-postgres
  labels:
    app: comment-service-postgres
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comment-service-postgres
  template:
    metadata:
      labels:
        app: comment-service-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
          name: postgres
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: comment-db
                key: username
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: comment-db
                key: url
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: comment-db
                key: password
      #   volumeMounts:
      #     - name: file-service-storage
      #       mountPath: /var/lib/postgresql/data/
      # volumes:
      # - name: file-service-storage
      #   persistentVolumeClaim:
      #     claimName: file-service-pvc
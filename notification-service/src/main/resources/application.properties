quarkus.application.name=notification-service
quarkus.http.port=8080
quarkus.http.auth.form.enabled=false
quarkus.http.auth.basic=false

smallrye.jwt.path.groups=role
quarkus.oidc.token.signature-algorithm=rs256
quarkus.oidc.application-type=service
quarkus.messaging.kafka.serializer-generation.enabled=true
quarkus.native.resources.includes=*.properties

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
kafka.group.id=${quarkus.uuid}

mp.messaging.connector.smallrye-kafka.auto.offset.reset=latest
# mp.messaging.incoming.chat-update.value.deserializer=org.ambrosia.config.KafkaDeserializer

mp.messaging.incoming.notification-persistence.connector=smallrye-kafka
mp.messaging.incoming.notification-persistence.auto.offset.reset=earliest
mp.messaging.incoming.notification-persistence.group.id=notification-service
mp.messaging.incoming.notification-persistence.topics=blog.notification
mp.messaging.incoming.notification-persistence.partitions=1

mp.messaging.incoming.community-ban.connector=smallrye-kafka
mp.messaging.incoming.community-ban.auto.offset.reset=earliest
mp.messaging.incoming.community-ban.topics=blog.community.ban
mp.messaging.incoming.community-ban.group.id=notification-service
mp.messaging.incoming.community-ban.partitions=1

mp.messaging.incoming.community-follow.connector=smallrye-kafka
mp.messaging.incoming.community-follow.auto.offset.reset=earliest
mp.messaging.incoming.community-follow.topics=blog.community.follow
mp.messaging.incoming.community-follow.group.id=notification-service
mp.messaging.incoming.community-follow.partitions=1

mp.messaging.incoming.post.connector=smallrye-kafka
mp.messaging.incoming.post.topics=blog.post
mp.messaging.incoming.post.auto.offset.reset=earliest
mp.messaging.incoming.post.group.id=notification-service
mp.messaging.incoming.post.partitions=1

mp.messaging.incoming.user.connector=smallrye-kafka
mp.messaging.incoming.user.auto.offset.reset=earliest
mp.messaging.incoming.user.topics=blog.user
mp.messaging.incoming.user.group.id=notification-service
mp.messaging.incoming.user.partitions=1

mp.messaging.incoming.community.connector=smallrye-kafka
mp.messaging.incoming.community.auto.offset.reset=earliest
mp.messaging.incoming.community.topics=blog.community
mp.messaging.incoming.community.group.id=notification-service
mp.messaging.incoming.community.partitions=1

mp.messaging.incoming.user-follow.connector=smallrye-kafka
mp.messaging.incoming.user-follow.auto.offset.reset=earliest
mp.messaging.incoming.user-follow.topics=blog.user.follow
mp.messaging.incoming.user-follow.group.id=notification-service
mp.messaging.incoming.user-follow.partitions=1

mp.messaging.incoming.notification-event.connector=smallrye-kafka
mp.messaging.incoming.notification-event.topics=blog.notification
mp.messaging.incoming.notification-event.auto.offset.reset=earliest
mp.messaging.incoming.notification-event.partitions=1

mp.messaging.incoming.comment-channel.connector=smallrye-kafka
mp.messaging.incoming.comment-channel.topics=blog.comment
mp.messaging.incoming.comment-channel.auto.offset.reset=latest
mp.messaging.incoming.comment-channel.partitions=1

mp.messaging.incoming.post-like-channel.connector=smallrye-kafka
mp.messaging.incoming.post-like-channel.topics=blog.post.like
mp.messaging.incoming.post-like-channel.auto.offset.reset=latest
mp.messaging.incoming.post-like-channel.partitions=1

mp.messaging.incoming.comment-like-channel.connector=smallrye-kafka
mp.messaging.incoming.comment-like-channel.topics=blog.comment.like
mp.messaging.incoming.comment-like-channel.auto.offset.reset=latest
mp.messaging.incoming.comment-like-channel.partitions=1

mp.messaging.incoming.post-view-channel.connector=smallrye-kafka
mp.messaging.incoming.post-view-channel.topics=blog.post.view.aggregation
mp.messaging.incoming.post-view-channel.key.deserializer=org.apache.kafka.common.serialization.LongDeserializer
mp.messaging.incoming.post-view-channel.auto.offset.reset=latest
mp.messaging.incoming.post-view-channel.partitions=1

mp.messaging.outgoing.activity-notification.connector=smallrye-kafka
mp.messaging.outgoing.activity-notification.topics=blog.activity
mp.messaging.outgoing.activity-notification.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.activity-notification.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

quarkus.native.additional-build-args=--initialize-at-run-time=com.github.f4b6a3.uuid\\,com.github.f4b6a3.uuid.util.internal.RandomUtil$SecureRandomPool

quarkus.datasource.devservices.reuse=false

quarkus.log.level=DEBUG
quarkus.native.container-build=true
quarkus.native.container-runtime=docker
quarkus.container-image.build=true
quarkus.container-image.name=${quarkus.application.name}
quarkus.container-image.tag=v1
quarkus.container-image.image=ghcr.io/ambrosia0/${quarkus.application.name}
quarkus.container-image.push=false
quarkus.jib.base-native-image=quay.io/quarkus/quarkus-distroless-image:2.0

quarkus.kubernetes.deploy=false
quarkus.kubernetes.image-pull-policy=never
quarkus.kubernetes.deployment-kind=deployment
quarkus.kubernetes.service-account=default
quarkus.kubernetes.namespace=blog
quarkus.kubernetes.replicas=1
quarkus.kubernetes.env.vars.HOSTNAME=metadata.name
quarkus.kubernetes.ports.http.container-port=8080
quarkus.kubernetes.ports.http.host-port=80
quarkus.kubernetes.service-type=ClusterIP
quarus.kubernetes.env.configmaps=oidc-config

# in dev cluster
quarkus.oidc.token.issuer=any
quarkus.oidc.enabled=true
%prod.quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL}
%prod.mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
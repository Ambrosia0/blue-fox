syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.ambrosia.content_service.kafka_events";

import "google/protobuf/timestamp.proto";

message PostCreated {
    uint64 id = 1;
    string author_id = 2;
    optional uint64 community_id = 3;
    string title = 4;
    string preview = 5;
    optional google.protobuf.Timestamp published_at = 6;
}

message PostDeleted {
    uint64 id = 1;
}

message PostEvent {
    oneof event {
        PostCreated created = 1;
        PostDeleted deleted = 2;
    }
}

message PostLikeNotification {
    map<uint64, int64> changes = 1;
}

message UserFollowed {
    string requesting_user = 1;
    string followed_user_id = 2;
}

message UserUnfollowed {
    string requesting_user = 1;
    string followed_user_id = 2;
}

message UserFollowEvent {
    oneof event {
        UserFollowed followed = 1;
        UserUnfollowed unfollowed = 2;
    }
}

message CommunityFollowed {
    string requesting_user = 1;
    uint64 community_id = 2;
}

message CommunityUnfollowed {
    string requesting_user = 1;
    uint64 community_id = 2;
}

message CommunityFollowEvent {
    oneof event {
        CommunityFollowed followed = 1;
        CommunityUnfollowed unfollowed = 2;
    }
}

message PostViewEvent {
    uint64 post_id = 1;
}

message PostPreviewEvent {
    repeated uint64 post_id = 1;
}

message AggregatedViewEvent {
    uint64 post_id = 1;
    int32 delta = 2;
}

message AggregatedPreviewEvent {
    uint64 post_id = 1;
    int32 delta = 2;
}
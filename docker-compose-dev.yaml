  s3-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - "44470:9000"
      - 9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc
    depends_on:
      - s3-storage
    volumes:
      - ./infra/minio/init.sh:/init-minio.sh:ro
    environment:
      BUCKET: publicbucket
      MINIO_ALIAS: s3-storage
      MINIO_ENDPOINT: http://s3-storage:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "/init-minio.sh"]
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      - kafka
    volumes:
      - ./infra/kafka/kafka-topics.txt:/config/topics.txt:ro
      - ./infra/kafka/kafka-init.sh:/kafka-init.sh
    command: ["/bin/sh", "/kafka-init.sh"]

  postgres:
    image: ghcr.io/ambrosia0/postgres-18-rum:latest
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    ports:
      - "5432"
    pull_policy: never
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1111
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=1
      - -c
      - max_replication_slots=1
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  elasticsearch:
    image: elasticsearch:9.3.2
    ports:
      - "9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
volumes:
  postgres_data:
  elastic_data:
  minio_data:
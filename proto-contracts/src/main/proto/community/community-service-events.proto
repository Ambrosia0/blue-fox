syntax = "proto3";

package community.v1;

option java_multiple_files = true;
option java_package = "com.ambrosia.community_service.kafka_events";

message CommunityCreate {
    string name = 1;
    string owner_id = 2;
    optional string avatar_id = 3;
    bool is_private = 4;
    map<string, ModeratorPermissions> community_permissions = 5;
    string slug = 6;
}

message CommunityDelete {}

message CommunityUpdate {
    string name = 1;
    string owner_id = 2;
    optional string avatar_id = 3;
    bool is_private = 4;
    map<string, ModeratorPermissions> community_permissions = 5;
    string slug = 6;
}

enum Permission {
    POST_DELETE = 0;
    COMMENT_DELETE = 1;
    USER_BAN = 2;
    USER_UNBAN = 3;
    FOLLOW_MANAGE = 4;
}

message ModeratorPermissions {
    repeated Permission permissions = 1;
}

message CommunityBan {
    int64 community_id = 1;
    string user_id = 2;
}

message CommunityUnban {
    int64 community_id = 1;
    string user_id = 2;
}

message CommunityEvent {
    string event_id = 1;
    int64 id = 2;
    oneof event {
        CommunityCreate create = 3;
        CommunityDelete delete = 4;
        CommunityUpdate update = 5;
    }
}

message CommunityBanEvent {
    oneof event {
        CommunityBan ban = 1;
        CommunityUnban unban = 2;
    }
}

message CommunityFollowAggregation {
    int64 community_id = 1;
    int32 delta = 2;
}

message PostCountAggregation {
    int64 community_id = 1;
    int32 delta = 2;
}

message CommunityFollowEvent {
    string requesting_user = 1;
    int64 community_id = 2;
    bool followed = 3;
}
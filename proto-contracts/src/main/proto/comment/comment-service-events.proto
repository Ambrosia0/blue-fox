syntax = "proto3";

package comment.v1;

option java_multiple_files = true;
option java_package = "com.ambrosia.comment_service.kafka_events";

message User {
    string id = 1;
    string username = 2;
    string first_name = 3;
    string last_name = 4;
    optional string avatar_id = 5;
}

message CommentCreated {
    int64 post_id = 1;
    User user = 2;
    string content = 3;
    optional string attachment_url = 4;
    optional int64 parent_coment = 5;
    int64 created_at = 6;
}

message CommentDeleted {
    int64 post_id = 1;
}

message CommentEvent {
    string event_id = 1;
    int64 comment_id = 2;
    oneof event {
        CommentCreated created = 3;
        CommentDeleted deleted = 4;
    }
}

message CommentDelta {
    int64 comment_id = 1;
    int32 delta = 2;
}

message CommentDeltas {
    repeated CommentDelta deltas = 1;
}

message CommentAggregate {
    repeated CommentDelta delta = 1;
}

message CommentLikeNotification {
    map<int64, CommentDeltas> changes = 1;
}
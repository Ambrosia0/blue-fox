syntax = "proto3";

package comment.v1;

option java_multiple_files = true;
option java_package = "com.ambrosia.comment_service.kafka_events";

message User {
    string id = 1;
    string username = 2;
    string first_name = 3;
    string last_name = 4;
    optional string avatar_id = 5;
}

message CommentCreated {
    User user = 1;
    string content = 2;
    optional string attachment_url = 3;
    optional int64 parent_comment = 4;
    int64 created_at = 5;
}

message CommentUpdated {
    string content = 1;
}

message CommentDeleted {}

message CommentEvent {
    string event_id = 1;
    int64 comment_id = 2;
    int64 post_id = 3;
    int64 version = 4;
    oneof event {
        CommentCreated created = 5;
        CommentDeleted deleted = 6;
        CommentUpdated update = 7;
    }
}

message CommentDelta {
    int64 comment_id = 1;
    int32 delta = 2;
}

message CommentDeltas {
    repeated CommentDelta deltas = 1;
}

message CommentAggregate {
    repeated CommentDelta delta = 1;
}

message CommentLikeNotification {
    map<int64, CommentDeltas> changes = 1;
}
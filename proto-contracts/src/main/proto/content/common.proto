syntax = "proto3";

package content.v1;

option java_multiple_files = true;
option java_package = "com.ambrosia.content_service.grpc";

message User {
    string id = 1;
    string username = 2;
    string first_name = 3;
    string last_name = 4;
    optional string avatar_id = 5;
}

message Community {
    int64 id = 1;
    string name = 2;
    optional string avatar_id = 3;
    string slug = 4;
    bool is_private = 5;
}

message ReplyTo {
    int64 id = 1;
    string title = 2;
}
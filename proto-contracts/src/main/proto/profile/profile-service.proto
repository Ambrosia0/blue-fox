syntax = "proto3";

package profile.v1;

option java_multiple_files = true;
option java_package = "com.ambrosia.profile_service.grpc";

message UserBlacklistResponse {
    repeated bytes user_id = 1;
}

message UserBlacklistRequest {
    bytes user_id = 1;
}

service ProfileService {
    rpc GetUserBlacklist(UserBlacklistRequest) returns (UserBlacklistResponse);
}
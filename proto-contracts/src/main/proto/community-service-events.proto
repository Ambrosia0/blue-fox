syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.ambrosia.community_service.kafka_events";

message CommunityCreate {
    uint64 id = 1;
    string name = 2;
    string owner_id = 3;
    optional string avatar_id = 4;
    bool is_private = 5;
}

message CommunityDelete {
    uint64 id = 1;
}

message CommunityUpdate {
    uint64 id = 1;
    string name = 2;
    string owner_id = 3;
    optional string avatar_id = 4;
    bool is_private = 5;
}

message CommunityBan {
    uint64 community_id = 1;
    string user_id = 2;
}

message CommunityUnban {
    uint64 community_id = 1;
    string user_id = 2;
}

message CommunityEvent {
    string event_id = 1;
    oneof event {
        CommunityCreate create = 2;
        CommunityDelete delete = 3;
        CommunityUpdate update = 4;
    }
}

message CommunityBanEvent {
    oneof event {
        CommunityBan ban = 1;
        CommunityUnban unban = 2;
    }
}

message CommunityFollowAggregation {
    uint64 community_id = 1;
    int32 delta = 2;
}

message PostCountAggregation {
    uint64 community_id = 1;
    int32 delta = 2;
}

message CommunityFollowEvent {
    string requesting_user = 1;
    uint64 community_id = 2;
    bool followed = 3;
}
syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.ambrosia.notification_service.kafka_events";


enum ActivityEventType {
    CONNECT = 0;
    DISCONNECT = 1;
    LEASE_REFRESH = 2;
}

message ActivityEvent {
    string user_id = 1;
    int64 timestamp = 2;
    ActivityEventType type = 3;
}
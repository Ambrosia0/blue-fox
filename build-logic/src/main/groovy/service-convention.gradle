plugins{
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.google.protobuf'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencies {
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    implementation project(':library-core')
    implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4j}"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "io.github.robsonkades:uuidv7:${uuidv7Lib}"
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
    testImplementation(testFixtures(project(":library-core")))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.testcontainers:testcontainers:${testContainers}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testContainers}"
    testImplementation "org.testcontainers:kafka:${testContainersKafka}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}
plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api 'org.springframework:spring-context'
    api 'org.springframework.boot:spring-boot-starter-test'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation(platform('org.junit:junit-bom:6.1.3'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testFixturesImplementation "org.testcontainers:testcontainers:${testContainers}"
    testFixturesImplementation "org.testcontainers:kafka:${testContainersKafka}"
    testFixturesImplementation "org.testcontainers:testcontainers-junit-jupiter:${testContainers}"
    testFixturesImplementation "com.github.dasniko:testcontainers-keycloak:${testContainersKeycloak}"
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}
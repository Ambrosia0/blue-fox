server:
  port: 8080
  forward-headers-strategy: framework
spring:
 threads:
  virtual:
    enabled: true
 application:
  name: content-service
 liquibase:
    enabled: true
 datasource:
  url: ${DB_URL:unset}
  username: ${DB_USER:unset}
  password: ${DB_PASSWORD:unset}
  hikari:
    connection-timeout: 20000
    initialization-fail-timeout: 5000
 elasticsearch:
   uris: ${ELASTIC_URIS:unset}
 data:
  redis:
   url: ${REDIS_URL:unset}
 cloud:
    aws:
      s3:
        endpoint: ${S3_ENDPOINT:unset}
        path-style-access-enabled: true
        region: ${S3_REGION:aws-global}
        endpoint-override: ${S3_PRESIGN_ENDPOINT:${S3_ENDPOINT:unset}}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
 security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URL:unset}
 kafka:
   bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:unset}
   listener:
    ack-mode: batch
   producer:
     key-serializer: org.apache.kafka.common.serialization.StringSerializer
     value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
   consumer:
     groupId: content-service
     properties:
      spring.json.trusted.packages: "*"
      spring.json.use.type.headers: false
     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
     value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
   streams:
     application-id: content-service-streams
     client-id: content-service-stream
     properties:
       '[commit.interval.ms]': 5000
       '[processing.guarantee]': exactly_once_v2
 grpc:
   client:
     channels:
      profile-channel:
        address: profile-service:9090
      community-channel:
        address: community-service:9090
app:
 default:
  number-of-partitions: 3
  preview-image-limit: 1
  preview-char-limit: 200
 s3:
  public-bucket: ${S3_BUCKET:publicbucket}
  base-prefix: files/post
  temp-prefix: temp/files/post
---
spring:
  config:
    activate:
      on-profile:
      - test
  kafka:
    streams:
      auto-startup: false
  liquibase:
    enabled: true
app:
 default:
  number-of-partitions: 3
  initial-content: '{"type":"doc","content":[{"type":"paragraph","content":[]}]}'
 auth:
  key-rotation-time: 666666
---
spring:
  config:
    activate:
      on-profile:
      - es-disabled
  elasticsearch:
    uris: none
  data:
    elasticsearch:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
    - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration
    - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration

  liquibase:
    contexts:
    - search-trgm
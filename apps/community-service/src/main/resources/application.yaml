server:
 port: 8080
 forward-headers-strategy: framework
spring:
 threads:
    virtual:
      enabled: true
 application:
  name: community-service
#  jackson:
#   deserialization:
#    '[USE_LONG_FOR_INTS]': true
 datasource:
  url: ${DB_URL:unset}
  username: ${DB_USER:unset}
  password: ${DB_PASSWORD:unset}
  hikari:
    connection-timeout: 20000
    initialization-fail-timeout: 5000
 elasticsearch:
    uris: ${ELASTIC_URIS:unset}
 data:
  redis:
   url: ${REDIS_URL:unset}
 cloud:
    aws:
      s3:
        endpoint: ${S3_ENDPOINT:unset}
        path-style-access-enabled: true
        region: ${S3_REGION:aws-global}
        endpoint-override: ${S3_PRESIGN_ENDPOINT:${S3_ENDPOINT:unset}}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
 liquibase:
    enabled: true
 kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:unset}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  consumer:
    properties:
        spring.json.trusted.packages: "*"
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    auto-offset-reset: earliest

  streams:
    application-id: community-service-streams
    client-id: community-service-stream
    properties:
      '[commit.interval.ms]': 5000
      '[processing.guarantee]': exactly_once_v2
  retry:
    topic:
      backoff:
        multiplier: 1.2
        delay: 5
        max-delay: 20
      attempts: 100
      
 security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URL:unset}
 grpc:
   client:
     channels:
      profile-channel:
        address: profile-service:9090
   server:
    ssl:
      enabled: false
app:
 file-service-endpoint: ${FILE_ENDPOINT:unset}
 s3:
  public-bucket: ${S3_BUCKET:publicbucket}
  base-prefix: avatars/community
  temp-prefix: temp/avatars/community

---
spring:
  main:
    allow-bean-definition-overriding: true
  config:
    activate:
      on-profile:
      - test
  kafka:
    streams:
      auto-startup: false
    # streams:
    #   application-id: test-${random.uuid}
  liquibase:
    enabled: true
---
spring:
  config:
    activate:
      on-profile:
      - es-disabled
  elasticsearch:
    uris: none
  data:
    elasticsearch:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
    - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration
    - org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration

  liquibase:
    contexts:
    - search-trgm
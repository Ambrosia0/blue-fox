server:
 port: 8080
 forward-headers-strategy: framework
spring:
 application:
  name: comment-service
 liquibase:
  enabled: true
 data:
    redis:
      url: ${REDIS_URL:unset}
 cloud:
    aws:
      s3:
        endpoint: ${S3_ENDPOINT:unset}
        path-style-access-enabled: true
        region: ${S3_REGION:aws-global}
        endpoint-override: ${S3_PRESIGN_ENDPOINT:${S3_ENDPOINT:unset}}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
 datasource:
   url: ${DB_URL:unset}
   username: ${DB_USER:unset}
   password: ${DB_PASSWORD:unset}
   hikari:
    connection-timeout: 10000
    initialization-fail-timeout: 10000
 kafka:
   bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:unset}
   listener:
    ack-mode: batch
   producer:
     key-serializer: org.apache.kafka.common.serialization.StringSerializer
     value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
   consumer:
     properties:
      spring.json.trusted.packages: "*"
      spring.json.use.type.headers: false # to avoid __TypeId__ header
     auto-offset-reset: earliest
     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
     value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  
 security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URL:unset}
 grpc:
  client:
   channels:
    profile-channel:
      address: profile-service:9090
    community-channel:
      address: community-service:9090
    content-channel:
      address: content-service:9090
app:
 s3:
   public-bucket: ${S3_BUCKET:publicbucket}
   base-prefix: files/comment
   temp-prefix: temp/files/comment
# logging:
#   level:
#     '[org.springframework.data]': trace
#     '[io.lettuce]': debug
  # - native
---
spring:
  config:
    activate:
      on-profile:
      - test
  kafka:
    streams:
      application-id: test-${random.uuid}
      auto-startup: false
      state-dir: "build/kafka-streams"
  liquibase:
    enabled: true
    contexts: test